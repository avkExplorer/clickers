<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Custom clicker keychains, built one key at a time. Spin the 3D keychain, tap your letters, and send your request."><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Click &amp; Charm Keychains</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style id="app-css">
/* Layout: a product-photo studio. The 3D keychain stands on a seamless sweep (left, sticky); the builder sits beside it; the request and price ladder follow. */
:root{
  --bg:#EFEEF3; --surface:#FFFFFF; --sunk:#F5F4F8; --ink:#27213A; --muted:#6B6580; --line:#DFDCE7;
  --accent:#6A45C6; --accent-ink:#FFFFFF; --pop:#D2486E; --cap:#F1EEF7; --cap-edge:#D3CDE0; --cap-ink:#2A2340;
  --studio-hi:#FAFAFC; --studio-lo:#DCDAE3; --studio-ink:#3A3350;
  --ok:#17875A; --ok-bg:#E1F4EA; --warn:#A86300; --warn-bg:#FBEFD9; --bad:#C6303F; --bad-bg:#FBE3E6;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131B; --surface:#1E1B27; --sunk:#191720; --ink:#F1EEF8; --muted:#A49DB8; --line:#322D42;
  --accent:#A58BFF; --accent-ink:#170F33; --pop:#FF86A6; --cap:#F4F1FB; --cap-edge:#8E86A6; --cap-ink:#241D38;
  --studio-hi:#3A3549; --studio-lo:#18161F; --studio-ink:#E6E1F2;
  --ok:#4FD39A; --ok-bg:#16322A; --warn:#F2B04B; --warn-bg:#3A2C14; --bad:#FF7381; --bad-bg:#3D1A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131B; --surface:#1E1B27; --sunk:#191720; --ink:#F1EEF8; --muted:#A49DB8; --line:#322D42;
  --accent:#A58BFF; --accent-ink:#170F33; --pop:#FF86A6; --cap:#F4F1FB; --cap-edge:#8E86A6; --cap-ink:#241D38;
  --studio-hi:#3A3549; --studio-lo:#18161F; --studio-ink:#E6E1F2;
  --ok:#4FD39A; --ok-bg:#16322A; --warn:#F2B04B; --warn-bg:#3A2C14; --bad:#FF7381; --bad-bg:#3D1A22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 72px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:clamp(32px,5.4vw,54px)}
h2{font-size:24px}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand b{font-family:var(--display);font-weight:600;font-size:21px}
.brand .logo{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);flex:none}
.brandtx{display:grid;text-align:left;line-height:1.1}
.brandtx small{font-size:12px;font-weight:600;color:var(--muted)}
.iglink{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--pop);text-decoration:none;border:1px solid var(--line);background:var(--surface)}
.iglink:hover{border-color:var(--pop)}
.iglink svg{width:18px;height:18px}
@media (max-width:520px){.iglink span{display:none}.iglink{padding:7px}}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero{display:grid;gap:10px;margin-bottom:22px;max-width:760px}
.hero .lede{max-width:62ch;font-size:16px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:8px}
input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:18px;min-width:0}

/* shop layout */
.shop{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:12px;min-width:0}
@media (max-width:860px){
  .shop{grid-template-columns:minmax(0,1fr)}
  .left{display:contents}
  .studio{order:1} .controls{order:2}
  .buy{order:3;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 10px 30px rgba(20,10,40,.18)}
}
/* studio sweep */
.studio{position:relative;border-radius:22px;overflow:hidden;height:clamp(420px,72vh,700px);background:radial-gradient(120% 80% at 50% 30%,var(--studio-hi) 0%,var(--studio-lo) 100%);border:1px solid var(--line);color:var(--studio-ink)}
@media (max-width:860px){.studio{height:440px}}
.stage3d{position:absolute;inset:0;touch-action:none}
.stage3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.stage3d canvas:active{cursor:grabbing}
.stage2d{position:absolute;inset:56px 0 52px;display:grid;place-items:center;overflow:auto;padding:8px}
.studio.is3d .stage2d{display:none}
.studio-top,.studio-foot{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;pointer-events:none;flex-wrap:wrap}
.studio-top{top:0}.studio-foot{bottom:0}
.studio-top>*,.studio-foot>*{pointer-events:auto}
.specline{font-weight:700;font-size:13px;background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink)}
.hint{font-size:12.5px;font-weight:600;opacity:.75}
.studio-acts{display:flex;gap:6px}
.iconbtn{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700}
.iconbtn:hover{border-color:var(--accent)}
.empty-stage{color:var(--muted);text-align:center;padding:14px;font-weight:600}
/* 2D fallback: vertical stack like the real thing */
.chain{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 10px 10px;border-radius:14px}
.ring{width:22px;height:14px;border:5px solid var(--base,#B9B4C6);border-bottom:0;border-radius:14px 14px 0 0;margin-bottom:-1px;flex:none}
.chain .key{background:var(--base,#B9B4C6);border-radius:12px;padding:5px;width:58px;height:58px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.chain .key .cap{position:static;width:100%;height:100%;background:var(--capbg,color-mix(in srgb,var(--base,#B9B4C6) 78%,#fff));color:var(--capink,#fff);text-shadow:0 1px 1px rgba(0,0,0,.18);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 0 0 2px color-mix(in srgb,var(--base,#B9B4C6) 60%,#000)}

/* keycaps (cart, order book, inventory) */
.key{position:relative;width:46px;height:48px;margin:0 2px;flex:none;border:0;padding:0;background:none}
.cap{position:absolute;inset:0 0 6px 0;border-radius:10px;background:var(--capbg,var(--cap));color:var(--capink,var(--cap-ink));display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:24px;text-shadow:0 1px 1px rgba(40,20,60,.18);box-shadow:0 5px 0 var(--cap-edge),inset 0 -3px 0 rgba(0,0,0,.06);transition:transform .12s}
.cap svg{width:26px;height:26px}
button.key:hover .cap{transform:translateY(2px);box-shadow:0 3px 0 var(--cap-edge)}
.key.out .cap{outline:2px dashed var(--bad);outline-offset:2px;opacity:.8}
.key.out::after{content:"OUT";position:absolute;top:-10px;right:-6px;font:700 9px var(--body);background:var(--bad);color:#fff;border-radius:6px;padding:1px 4px}
.key.sm{width:30px;height:32px;margin:0 1px}
.key.sm .cap{font-size:15px;border-radius:7px;inset:0 0 4px 0;box-shadow:0 3px 0 var(--cap-edge)}
.key.sm .cap svg{width:17px;height:17px}

/* key strip + letter board */
.striprow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.strip{display:flex;flex-wrap:wrap;gap:6px 2px;min-height:66px;padding:12px 10px 8px;border-radius:14px;background:var(--sunk);border:1px dashed var(--line);align-items:center}
.strip .key{cursor:pointer}
.key.sel .cap{outline:3px solid var(--accent);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.lk{position:relative;height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:20px;line-height:1;box-shadow:inset 0 -3px 0 var(--line);display:grid;place-items:center;padding:0}
.lk:hover{border-color:var(--accent);color:var(--accent)}
.lk:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 var(--line)}
.lk:disabled{opacity:.38;cursor:not-allowed;color:var(--ink);border-color:var(--line)}
.lk small{position:absolute;bottom:3px;left:0;right:0;font:700 8.5px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--bad)}
.capedit{display:grid;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line)}
.capsw{display:flex;gap:8px;flex-wrap:wrap}
.capsw button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1);padding:0}
.capsw button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}

/* buy bar */
.buy{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px}
.pricebox{display:grid;gap:2px;min-width:0}
.price{font-family:var(--display);font-weight:600;font-size:34px;color:var(--pop);line-height:1}
.strike{text-decoration:line-through;color:var(--muted);font-size:15px}
.offer{font-size:12.5px;font-weight:700;color:var(--pop)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pricerow{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}

/* controls */
.bigwrap{position:relative}
.bigin{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:12px 84px 12px 16px;background:var(--sunk)}
.count{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;min-height:24px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.colors{display:flex;gap:14px;flex-wrap:wrap}
.swatch{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--muted)}
.swatch i{width:48px;height:48px;border-radius:13px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),inset 0 0 0 7px color-mix(in srgb,var(--c) 80%,#fff);transition:transform .12s}
.swatch:hover i{transform:translateY(-2px)}
.swatch[aria-pressed="true"]{color:var(--ink)}
.swatch[aria-pressed="true"] i{outline:3px solid var(--accent);outline-offset:3px}
.swatch:disabled{opacity:.45;cursor:not-allowed}
.charmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.charmbtn{display:grid;justify-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 8px 10px;font-size:12px;font-weight:600;line-height:1.25;text-align:center}
.charmbtn:hover{border-color:var(--accent)}
.charmbtn:disabled{opacity:.45;cursor:not-allowed}
.charmbtn .tag{color:var(--pop);font-size:11px;font-weight:700}
.offers{display:grid;gap:4px}

/* request + checkout */
.request{margin-top:28px;display:grid;gap:14px}
.reqgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.reqgrid{grid-template-columns:minmax(0,1fr)}}
.cart{display:grid;gap:12px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.line .keys{display:flex;flex-wrap:wrap;gap:2px;padding-top:6px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.cashnote{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13px}
.slip{border:2px dashed var(--line);border-radius:14px;padding:14px;background:var(--sunk);display:grid;gap:10px}
.sendto{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.sendto .row{align-items:center}
.sendto a.btn{text-decoration:none}
.slip pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;max-height:260px;overflow:auto}
.code{font-family:var(--mono);font-weight:500;letter-spacing:.04em}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%}

/* price ladder: one mini cube per key, drawn to scale */
.ladder{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.rung{display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:700}
.rung .stack{display:flex;flex-direction:column;gap:2px}
.rung .stack i{width:20px;height:20px;border-radius:5px;background:var(--accent);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent) 70%,#fff)}
.rung b{font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink)}
.rung.extra .stack i{background:transparent;border:2px dashed var(--accent);box-shadow:none}
.rung.fancy .stack i{background:#FFD866;box-shadow:inset 0 0 0 4px #FFEDB0}

/* nav */
.brand{border:0;background:none;padding:0;color:inherit}
.nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.navlink{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.navlink:hover{color:var(--ink);background:var(--sunk)}
.navlink[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.acct{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-size:14px;margin-left:4px}
.avatar{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;flex:none;text-transform:uppercase}

/* landing */
.land{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center;margin-bottom:40px}
@media (max-width:860px){.land{grid-template-columns:minmax(0,1fr)}.land-studio{order:-1}}
.land-copy{display:grid;gap:18px;align-content:center}
.land-h{font-size:clamp(46px,7.4vw,92px);line-height:.95;letter-spacing:-.02em}
.land-h span{color:var(--accent)}
.land .lede{font-size:17px;max-width:44ch}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn.big{padding:15px 22px;font-size:16px;border-radius:14px}
.land-studio{height:clamp(460px,76vh,760px)}
@media (max-width:860px){.land-studio{height:460px}}
.steps{display:grid;gap:14px}
.stepgrid{list-style:none;counter-reset:step;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.stepgrid{grid-template-columns:minmax(0,1fr)}}
.stepgrid li{counter-increment:step;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stepgrid li::before{content:counter(step);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);border:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent);box-shadow:inset 0 -3px 0 var(--line)}
.stepgrid b{font-family:var(--display);font-weight:600;font-size:19px}

/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:start;max-width:980px}
@media (max-width:820px){.auth{grid-template-columns:minmax(0,1fr)}}
.authcard{gap:16px}
.authcard h1{font-size:clamp(30px,4.6vw,44px)}
.authform{display:grid;gap:14px}
.authside{display:grid;gap:10px;padding:18px;border-radius:var(--r);background:var(--sunk);border:1px dashed var(--line)}
.authside ul,.terms ul{margin:0;padding-left:18px;display:grid;gap:6px}
.acctlist{display:grid;gap:8px}
.acctbtn{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.acctbtn:hover{border-color:var(--accent)}
.acctbtn .avatar{width:38px;height:38px;font-size:19px;border-radius:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.guardian{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;display:grid;gap:12px}
.guardian legend{font-weight:700;font-size:13px;padding:0 6px}
.terms{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:13.5px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px}
.gate{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--sunk)}
.who{display:flex;align-items:center;gap:10px}
.who>div{flex:1;min-width:0}

var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+(Math.round(n*100)/100).toFixed(2)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function charmById(id){for(var i=0;i<catalog.charms.length;i++)if(catalog.charms[i].id===id)return catalog.charms[i];return null}
function colorById(id){for(var i=0;i<catalog.colors.length;i++)if(catalog.colors[i].id===id)return catalog.colors[i];return null}
function kits(){return catalog.kits||(catalog.kits=[])}
function kitById(id){var ks=kits();for(var i=0;i<ks.length;i++)if(ks[i].id===id)return ks[i];return null}
function kitPic(k){return k&&KIT_PICS[k.pic]||''}
function kitImg(k,cls){var src=kitPic(k);return src?'<img class="'+cls+'" src="'+src+'" alt="" loading="lazy">':'<span class="'+cls+' nopic" aria-hidden="true">🎨</span>'}
function ss(k,v){try{if(v===undefined){var x=sessionStorage.getItem(k);sessionStorage.removeItem(k);return x?JSON.parse(x):null}sessionStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

var toastT;
function toast(msg){var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

/* ---------- keycaps ---------- */
function capHTML(ch,opts){
  opts=opts||{};
  var c=ch.id?ch:charmById(ch);
  var inner,bg='';
  if(c&&c.icon){inner='<svg viewBox="0 0 24 24" aria-hidden="true" style="color:'+(c.kind==='fancy'||!opts.cap?(ICON_TINT[c.icon]||'#555'):'var(--capink)')+'">'+(ICONS[c.icon]||'')+'</svg>';}
  else inner=esc(c?c.label:(opts.raw||'?'));
  if(c&&c.kind==='fancy')bg='--capbg:linear-gradient(160deg,#FFF6C9,#FFE08A);';
  else if(opts.cap){var cp=capById(opts.cap);bg='--capbg:'+cp[2]+';--capink:'+cp[3]+';'}
  var cls='key'+(opts.sm?' sm':'')+(opts.out?' out':'')+(opts.sel?' sel':'');
  var title=esc((c?c.name:(opts.raw+' (not in our collection)'))+(opts.cap&&!(c&&c.kind==='fancy')?', '+capById(opts.cap)[1]+' cap':''));
  if(opts.btn!=null)return '<button type="button" class="'+cls+'" style="'+bg+'" data-k="'+opts.btn+'" aria-pressed="'+!!opts.sel+'" title="'+title+'" aria-label="Key '+(+opts.btn+1)+': '+title+'"><span class="cap">'+inner+'</span></button>';
  return '<span class="'+cls+'" style="'+bg+'" title="'+title+'"><span class="cap">'+inner+'</span></span>';
}
/* Keycap colors. Each key gets its own; new keys rotate through the set. [id, name, cap, glyph] */
var CAPS=[['mint','Mint','#86D9B9','#FFFFFF'],['lemon','Lemon','#FFD452','#FFFFFF'],['cloud','Cloud white','#FBF9F5','#E5739B'],['lilac','Lilac','#AE93EE','#FFFFFF'],['blush','Blush','#F296B2','#FFFFFF'],['sky','Sky','#86BDF0','#FFFFFF']];
function capById(id){for(var i=0;i<CAPS.length;i++)if(CAPS[i][0]===id)return CAPS[i];return CAPS[0]}
function nextCap(i){return CAPS[i%CAPS.length][0]}
/* ---------- build from text ---------- */
function keysFromText(text){
  var out=[];var chars=Array.from(text.toUpperCase());
  for(var i=0;i<chars.length;i++){var ch=chars[i];if(/\s/.test(ch))continue;
    var m=null;for(var j=0;j<catalog.charms.length;j++){var c=catalog.charms[j];if(c.label&&c.label.toUpperCase()===ch&&c.kind!=='theme'&&c.kind!=='fancy'){m=c;break}}
    out.push(m?{id:m.id}:{raw:ch});}
  return out;
}
function currentKeys(){return S.keys}
function keyText(keys){return keys.map(function(k){var c=k.id&&charmById(k.id);return c&&c.label&&c.kind!=='theme'&&c.kind!=='fancy'?c.label:''}).join('')}
function addKey(id){
  if(S.keys.length>=catalog.pricing.maxKeys){toast('That keychain is full ('+catalog.pricing.maxKeys+' keys max).');return}
  S.keys.push({id:id,cap:nextCap(S.keys.length)});S.sel=null;updateBuilder();
}
/* ---------- pricing ---------- */
function minK(){return Math.max(1,+catalog.pricing.minKeys||1)}
function basePrice(n){var p=catalog.pricing;if(n<=0)return 0;var t=p.tiers;
  if(t[String(n)]!=null)return +t[String(n)];
  var ks=Object.keys(t).map(Number).sort(function(a,b){return a-b});if(!ks.length)return 0;
  if(n<ks[0])return +t[String(ks[0])];
  var maxT=ks[ks.length-1];return +t[String(maxT)]+(n-maxT)*(+p.extraKey||0);}
function priceFor(keys){
  var n=keys.length,fancy=0;keys.forEach(function(k){var c=k.id&&charmById(k.id);if(c&&c.kind==='fancy')fancy++});
  var base=basePrice(n)+fancy*(+catalog.pricing.fancyExtra||0);
  var best=null,bestOff=0;
  (catalog.offers||[]).forEach(function(o){if(!o.active||o.type==='magnet')return;if(n<(+o.minKeys||1))return;if(+o.maxKeys&&n>+o.maxKeys)return;
    var off=0;if(o.type==='percent')off=base*(+o.value||0)/100;else if(o.type==='flat')off=+o.value||0;else if(o.type==='price')off=base-(+o.value||0);
    off=Math.max(0,Math.min(base,off));if(off>bestOff){bestOff=off;best=o}});

function viewerTick(ms){
  requestAnimationFrame(viewerTick);
  var t=ms/1000,dt=Math.min(0.05,t-lastT||0.016);lastT=t;V.clock=t;
  if(!V.visible||!V.r.domElement.isConnected)return;
  var rest=0.42;
  if(V.mode==='home'){if(!REDUCED&&t-V.lastInteract>3)V.ctl.autoRotate=true}
  else if(!REDUCED&&t-V.lastInteract>2.5)rest+=Math.sin(t*0.45)*0.2;
  V.group.rotation.y+=(rest-V.group.rotation.y)*0.04;
  var steps=Math.ceil(dt/0.008),h=dt/steps;
  V.keyObjs.forEach(function(k){
    if(k.delay>0){k.delay-=dt;return}
    for(var s=0;s<steps;s++){
      var ay=170*(k.ty-k.y)-20*k.vy;k.vy+=ay*h;k.y+=k.vy*h;
      var as=260*(1-k.s)-13*k.vs;k.vs+=as*h;k.s+=k.vs*h;
      var td=k.down?-0.055:0,ad=1400*(td-k.d)-(k.down?40:24)*k.vd;k.vd+=ad*h;k.d+=k.vd*h;
    }
    var sc=Math.max(0.02,k.s);k.g.position.y=k.y;k.g.scale.set(sc,sc*(1+k.d*0.7),sc);k.press.position.z=k.d;
    if(k.glow>0){k.glow=Math.max(0,k.glow-dt*(k.down?0.2:1.2));k.capMat.emissiveIntensity=0.9*k.glow}
  });
  if(V.head&&V.keyObjs[0]){var k0=V.keyObjs[0];V.head.position.y=k0.y+0.5*Math.max(0.02,k0.s);V.head.scale.setScalar(Math.min(1,Math.max(0.02,k0.s)))}
  if(V.camGoal){V.cam.position.lerp(V.camGoal.pos,0.08);V.ctl.target.lerp(V.camGoal.tgt,0.08);if(V.cam.position.distanceTo(V.camGoal.pos)<0.01)V.camGoal=null}
  V.ctl.update();V.r.render(V.scene,V.cam);
}

async function submitOrder(){

/* ---------- orders (db) ---------- */
async function saveOrder(o,source){
  var doc={code:o.code,customer:o.customer,items:o.items,total:o.total,payment:'Cash on pickup',status:'new',stockApplied:false,source:source,createdAt:o.createdAt||Date.now(),updatedAt:Date.now()};
  await S.db.collection('orders').doc(o.code).set(doc);
  try{await upsertCustomer(o.customer,doc.createdAt)}catch(e){toast('Order saved, but the customer record didn’t update.')}
}
/* Customers are keyed by phone so the same person merges across devices and stall orders. */
function custIdFor(phone){var d=String(phone||'').replace(/\D/g,'');return d.length>=7?'p-'+d:''}
async function upsertCustomer(c,at){
  if(!S.db||!c)return;var id=custIdFor(c.phone)||c.id;if(!id)return;
  var ref=S.db.collection('customers').doc(id),snap=await ref.get();
  var body={name:c.name,phone:c.phone,email:c.email||'',minor:!!c.minor,guardian:c.minor?c.guardian:null,accountId:c.id||'',lastOrderAt:at||Date.now(),updatedAt:Date.now()};
  if(c.termsAt)body.termsAt=c.termsAt;
  if(snap.exists)await ref.update(body);
  else await ref.set(Object.assign({id:id,tags:[],note:'',firstSeen:Date.now(),termsAt:c.termsAt||0},body));
}
function custOf(o){var c=o.customer||{};var id=custIdFor(c.phone)||c.id;return id?S.custById[id]:null}
function subscribeCustomers(){
  S.db.collection('customers').limit(1000).onSnapshot(function(snap){
    S.customers=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.custById={};S.customers.forEach(function(c){S.custById[c.id]=c});
    if(S.view==='admin'&&(S.tab==='customers'||S.tab==='orders'))renderAdminBody();
  },function(e){if(S.view==='admin')toast('Customers could not load ('+e.code+').')});
}
function subscribeOrders(){
  S.db.collection('orders').orderBy('createdAt','desc').limit(500).onSnapshot(function(snap){
    S.orders=snap.docs.map(function(d){var x=d.data();return Object.assign({id:d.id},x)});S.ordersReady=true;if(S.view==='admin'&&(S.tab==='orders'||S.tab==='customers'))renderAdminBody();
  },function(e){S.ordersReady=true;if(S.view==='admin')toast('Orders could not load ('+e.code+').')});
}
function stockDelta(o,sign){
  o.items.forEach(function(l){if(l.kit){var kt=kitById(l.kit);if(kt)kt.stock=Math.max(0,+kt.stock+sign*(+l.qty||1));return}
    var col=colorById(l.colorId);if(col)col.stock=Math.max(0,+col.stock+sign);
    catalog.bases=Math.max(0,+catalog.bases+sign);
    l.keys.forEach(function(k){var c=k.id&&charmById(k.id);if(c)c.stock=Math.max(0,+c.stock+sign)})});
}
async function setStatus(o,status){
  if(S.busy)return;S.busy=true;
  try{
    if(status==='confirmed'&&!o.stockApplied){
      var sh=shortages(o.items);if(sh.length){toast('Not enough stock: '+sh.join(', '));return}
      await S.db.doc('orders/'+o.id).update({status:status,stockApplied:true,updatedAt:Date.now()});
      stockDelta(o,-1);await publishCatalog('Order '+o.code+' confirmed. Stock updated.');return;
    }
    if(status==='cancelled'&&o.stockApplied){
      await S.db.doc('orders/'+o.id).update({status:status,stockApplied:false,updatedAt:Date.now()});
      stockDelta(o,+1);await publishCatalog('Order '+o.code+' cancelled. Stock returned.');return;
    }
    var patch={status:status,updatedAt:Date.now()};if(status==='picked')patch.paidAt=Date.now();
    await S.db.doc('orders/'+o.id).update(patch);toast(o.code+': '+STATUS[status]);
  }catch(e){toast('That didn’t save: '+(e&&e.message||e&&e.code||'try again'))}
  finally{S.busy=false}
}

var ACC={list:[],cur:null};
function accLoad(){try{var x=JSON.parse(localStorage.getItem('cc-accounts')||'null');if(x&&Array.isArray(x.list))ACC={list:x.list,cur:x.cur||null}}catch(e){}}
function accSave(){try{localStorage.setItem('cc-accounts',JSON.stringify(ACC))}catch(e){}}
function me(){for(var i=0;i<ACC.list.length;i++)if(ACC.list[i].id===ACC.cur)return ACC.list[i];return null}
function maskPhone(p){var d=String(p||'').replace(/\D/g,'');return d.length>4?'•••'+d.slice(-4):p}

function bindAuth(){
  var list=$('.acctlist');if(list)list.addEventListener('click',function(e){var b=e.target.closest('[data-acc]');if(!b)return;ACC.cur=b.dataset.acc;accSave();var a=me();toast('Signed in as '+a.name+'.');afterAuth()});
  var f=$('#accform');if(!f)return;
  $('#aminor').addEventListener('change',function(e){$('#gbox').hidden=!e.target.checked});
  f.addEventListener('input',function(){S.draft={name:$('#aname').value,phone:$('#aphone').value,email:$('#aemail').value,minor:$('#aminor').checked,guardian:{name:$('#gname').value,phone:$('#gphone').value}}});
  f.addEventListener('submit',function(e){e.preventDefault();
    var g=function(id){return $('#'+id).value.trim()},err=function(m,id){var p=$('#aerr');p.textContent=m;p.hidden=false;if(id)$('#'+id).focus()};
    var name=g('aname'),phone=g('aphone'),email=g('aemail'),minor=$('#aminor').checked,gn=g('gname'),gp=g('gphone');
    if(name.length<2)return err('Add your name.','aname');
    if(phone.replace(/\D/g,'').length<7)return err('Add a phone number with at least 7 digits.','aphone');
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('That email doesn’t look right. Fix it or leave it blank.','aemail');
    if(minor&&gn.length<2)return err('Add your parent or guardian’s name.','gname');
    if(minor&&gp.replace(/\D/g,'').length<7)return err('Add your parent or guardian’s phone.','gphone');
    if(!$('#aterms').checked)return err('Tick the box to agree to the shop conditions.','aterms');
    var a=S.authMode==='account'?me():null,isNew=!a;
    if(isNew){a={id:uid('u-'),createdAt:Date.now()};ACC.list.push(a)}
    a.name=name;a.phone=phone;a.email=email;a.minor=minor;a.guardian=minor?{name:gn,phone:gp}:null;if(!a.termsAt)a.termsAt=Date.now();
    ACC.cur=a.id;accSave();S.draft=null;toast(isNew?'Account created. Hi, '+name.split(' ')[0]+'!':'Account saved.');afterAuth();
  });
  var so=$('#signout');if(so)so.addEventListener('click',function(){ACC.cur=null;accSave();toast('Signed out.');go('home')});
  var fg=$('#forget');if(fg)fg.addEventListener('click',function(){var id=ACC.cur;ACC.list=ACC.list.filter(function(x){return x.id!==id});ACC.cur=null;accSave();toast('Account removed from this device.');go('home')});
}
function afterAuth(){var to=S.after||'home';S.after=null;go(to)}
function go(where){
  if(S.fs){S.fs=null;document.documentElement.classList.remove('noscroll')}
  if(where==='signin'||where==='signup'||where==='account'){
    if(where==='account'&&!me())where='signin';
    if(S.view!=='auth')S.after=S.view==='admin'?'home':S.view;
    S.view='auth';S.authMode=where;
  }else if(where==='admin'&&!S.canEdit)S.view='home';
  else if(where==='kits'){S.view='shop';render();var ks=$('#kits');try{if(ks)ks.scrollIntoView({block:'start'});else window.scrollTo(0,0)}catch(e){}return}
  else S.view=where;
  render();try{window.scrollTo(0,0)}catch(e){}
}

   Tapping a frame opens it full screen with a back button; prices appear only in the shop, once something is picked. */

}

/* ---------- full-screen frames (the browser back button closes them too) ---------- */
function openFS(which){if(S.fs===which)return;S.fs=which;S.fsFrom=which;try{history.pushState({ccfs:which},'')}catch(e){}applyFS()}
function closeFS(){if(!S.fs)return;var st=null;try{st=history.state}catch(e){}if(st&&st.ccfs){history.back();return}S.fs=null;applyFS()}
function applyFS(){
  var c=$('#fclk'),d=$('#fsdiy');
  if(c)c.classList.toggle('full',S.fs==='clk');
  if(d){d.hidden=S.fs!=='diy';if(S.fs==='diy'){if(!d.firstChild)renderDeck();else requestAnimationFrame(sizeSpins)}}
  document.documentElement.classList.toggle('noscroll',!!S.fs);
  var f=S.fs==='clk'?c:S.fs==='diy'?d:null,b=f?f.querySelector('[data-close]'):$('[data-open="'+S.fsFrom+'"]');
  if(b)try{b.focus({preventScroll:true})}catch(e){}
}
window.addEventListener('popstate',function(e){var w=e.state&&e.state.ccfs||null;if(w&&S.view!=='home')w=null;if(S.fs!==w){S.fs=w;applyFS()}});
document.addEventListener('keydown',function(e){if(!S.fs)return;
  if(e.key==='Escape'){e.preventDefault();closeFS()}
  else if(S.fs==='diy'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();deckGo(e.key==='ArrowRight'?1:-1)}});
/* ---------- DIY deck: kits pile up like slides; each one spins (or tilts) and can be painted for fun ---------- */
var D={i:0,tool:'spin',raf:0};
function renderDeck(){
  var d=$('#fsdiy'),dk=deckKits();D.i=Math.max(0,Math.min(D.i,dk.length-1));
  var h='<div class="fs-bar"><button type="button" class="backbtn" data-close>'+BACK+'Back</button><b class="fs-title">DIY Coloring Kits</b><span class="deckcount num" id="deckcount"></span></div>';
  h+='<div class="deckarea"><div class="deckstage"><div class="deck" id="deck">';
  dk.forEach(function(k,i){var fr=kitFrames(k),art=fr.length>1?'<img class="spin-img" src="'+fr[0]+'" alt="'+esc(k.name)+'" draggable="false"><img class="spin-img spin-b" src="'+fr[1]+'" alt="" draggable="false">':kitArt(k,'spin-img');
    h+='<article class="slide" aria-roledescription="slide" aria-label="'+esc(k.name)+'"><div class="spin'+(fr.length>1?' multi':'')+'" data-kit="'+esc(k.id)+'"><div class="spin-in">'+art+(fr.length>1?'<span class="turnbadge">'+TURN+fr.length+' sides</span>':'')+'<canvas class="paint" width="720" height="720"></canvas><span class="sheen" aria-hidden="true"></span></div></div>'+
    '<div class="slide-cap"><div><b>'+esc(k.name)+'</b><span class="small muted">'+esc(k.desc||'')+'</span></div><button type="button" class="btn" data-pick="'+esc(k.id)+'">Choose this</button></div></article>'});
  h+='</div><button type="button" class="deckarrow prev" data-step="-1" aria-label="Previous kit">'+BACK+'</button><button type="button" class="deckarrow next" data-step="1" aria-label="Next kit">'+BACK+'</button></div>';
  h+='<div class="dots">'+dk.map(function(k,i){return '<button type="button" data-dot="'+i+'" aria-label="'+esc(k.name)+'"></button>'}).join('')+'</div></div>';
  h+='<aside class="paintplay" aria-label="Paint Play">'+sparkles(3)+'<span class="eyebrow">Paint Play</span><b class="pp-h">Paint it before you pick it</b>';
  h+='<div class="tools"><button type="button" class="tool" data-tool="spin" aria-pressed="true">'+TURN+'<span>Spin</span></button>'+PAINTS.map(function(p){return '<button type="button" class="tool brush" data-tool="'+p[0]+'" style="--c:'+p[2]+'" aria-pressed="false">'+BRUSH+'<span>'+p[1]+'</span></button>'}).join('')+'</div>';
  if(KIT_PICS.paints_1)h+='<figure class="inkit"><img src="'+KIT_PICS.paints_1+'" alt=""><figcaption class="small"><b>In every kit</b><br>3 colour pods and a brush</figcaption></figure>';
  h+='<p class="small muted" id="pphint">Drag the kit to turn it. Pick a color to paint it.</p><button type="button" class="btn ghost small" id="ppreset">Reset paint</button><p class="small muted">Just for fun. Your painting is not part of the order.</p></aside>';
  d.innerHTML=h;
  d.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.dataset;
    if(t.close!=null)closeFS();
    else if(t.step)deckGo(+t.step);
    else if(t.dot!=null){D.i=+t.dot;deckShow()}
    else if(t.tool){D.tool=t.tool;d.querySelectorAll('[data-tool]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});d.classList.toggle('painting',D.tool!=='spin');
      $('#pphint').textContent=D.tool==='spin'?'Drag the kit to turn it. Pick a color to paint it.':'Drag on the kit to paint it '+t.tool+'. Tap Spin to turn it again.'}
    else if(t.pick){var id=t.pick;go('kits');addKit(id)}
    else if(b.id==='ppreset'){var cv=d.querySelector('.slide.cur .paint');if(!cv)return;cv.classList.add('wipe');setTimeout(function(){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.classList.remove('wipe')},300)}});
  d.querySelectorAll('.spin').forEach(function(el){el._frames=kitFrames(kitById(el.dataset.kit));el._pos=0;el._idle=0;bindSpin(el)});
  if(!D.raf)D.raf=requestAnimationFrame(spinTick);
  if(window.ResizeObserver)new ResizeObserver(sizeSpins).observe($('#deck'));
  deckShow();requestAnimationFrame(sizeSpins);
}
function deckShow(){
  var sl=document.querySelectorAll('#deck .slide'),n=sl.length;
  sl.forEach(function(s,i){var o=i-D.i;
    s.style.transform=o<0?'translate3d(-125%,0,0) rotate(-10deg)':'translate3d('+(o*18)+'px,'+(o*-12)+'px,0) scale('+(1-o*0.06)+') rotate('+(o*2.5)+'deg)';
    s.style.zIndex=String(50-Math.abs(o));s.style.opacity=o<0||o>3?'0':'1';s.classList.toggle('cur',o===0);s.setAttribute('aria-hidden',String(o!==0));s.inert=o!==0});
  document.querySelectorAll('#fsdiy [data-dot]').forEach(function(b){b.setAttribute('aria-current',String(+b.dataset.dot===D.i))});
  var c=$('#deckcount');if(c)c.textContent=(D.i+1)+' / '+n;
  var p=$('#fsdiy .prev'),x=$('#fsdiy .next');if(p)p.disabled=D.i<=0;if(x)x.disabled=D.i>=n-1;
}
function deckGo(step){var j=Math.max(0,Math.min(deckKits().length-1,D.i+step));if(j===D.i)return;D.i=j;deckShow()}
/* Keep each spin square so the paint layer lines up with the photo. */
function sizeSpins(){document.querySelectorAll('#deck .spin').forEach(function(sp){var z=Math.max(80,Math.min(sp.clientWidth,sp.clientHeight)-36);sp.firstChild.style.width=z+'px';sp.firstChild.style.height=z+'px'})}
function bindSpin(el){
  var st=null,inner=el.firstChild;
  el.addEventListener('pointerdown',function(e){if(!el.closest('.slide').classList.contains('cur'))return;
    try{el.setPointerCapture(e.pointerId)}catch(x){}st={x:e.clientX,y:e.clientY,t:performance.now(),pos:el._pos};el._goal=null;
    if(D.tool==='spin')el.classList.add('drag');else paintStart(el,e)});
  el.addEventListener('pointermove',function(e){if(!st)return;
    if(D.tool!=='spin'){paintMove(el,e);return}
    var dx=e.clientX-st.x,dy=e.clientY-st.y,f=el._frames;
    /* Several real angles: one full turn per ~1.4 widths of drag, cross-fading between neighbouring sides. */
    if(f.length>1){spinTo(el,st.pos-dx*f.length/(1.4*Math.max(160,el.clientWidth)));el.style.setProperty('--sx',(50+dx*0.2)+'%')}
    else{var ry=Math.max(-40,Math.min(40,dx*0.3)),rx=Math.max(-16,Math.min(16,-dy*0.15));inner.style.transform='rotateY('+ry+'deg) rotateX('+rx+'deg)';el.style.setProperty('--sx',(50+ry)+'%')}});
  var end=function(e,swipe){if(!st)return;var dt=performance.now()-st.t,dx=e.clientX-st.x;
    if(D.tool==='spin'){el.classList.remove('drag');inner.style.transform='';el.style.removeProperty('--sx');
      if(el._frames.length>1){el._goal=Math.round(el._pos);el._idle=performance.now()}
      else if(swipe&&dt<300&&Math.abs(dx)>60)deckGo(dx<0?1:-1)}
    else P.cv=null;
    st=null};
  el.addEventListener('pointerup',function(e){end(e,true)});
  el.addEventListener('pointercancel',function(e){end(e,false)});
}
/* Show a fractional position between real angles: the next side fades in over the current one while both squeeze a little, like turning. */
function spinTo(el,pos){var f=el._frames,n=f.length,p=((pos%n)+n)%n,i=Math.floor(p),t=p-i,j=(i+1)%n;el._pos=pos;
  var ims=el.querySelectorAll('.spin-img');if(ims.length<2)return;
  if(ims[0]._i!==i){ims[0]._i=i;ims[0].src=f[i]}if(ims[1]._i!==j){ims[1]._i=j;ims[1].src=f[j]}
  ims[1].style.opacity=String(t);var s='scaleX('+(1-0.1*Math.sin(Math.PI*t)).toFixed(3)+')';ims[0].style.transform=ims[1].style.transform=s}
/* Settle on the nearest side after a drag; when left alone, turn to the next side every couple of seconds. */
function spinTick(now){D.raf=requestAnimationFrame(spinTick);if(S.fs!=='diy')return;
  var el=document.querySelector('#deck .slide.cur .spin.multi');if(!el||el.classList.contains('drag'))return;
  if(el._goal==null&&D.tool==='spin'&&!REDUCED&&now-(el._idle||0)>2200){el._goal=Math.round(el._pos)+1;el._idle=now}
  if(el._goal!=null){var d=el._goal-el._pos;if(Math.abs(d)<0.004){spinTo(el,el._goal);el._goal=null}else spinTo(el,el._pos+d*0.1)}}
/* Paint Play: soft dabs bloom onto a canvas over the photo; multiply blending lets the white plaster take the color. */
var P={cv:null,last:null,dabs:[],raf:0};
function paintHex(){for(var i=0;i<PAINTS.length;i++)if(PAINTS[i][0]===D.tool)return PAINTS[i][2];return PAINTS[2][2]}
function canvasPt(cv,e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*cv.width,y:(e.clientY-r.top)/r.height*cv.height}}
function paintStart(el,e){P.cv=el.querySelector('.paint');P.last=canvasPt(P.cv,e);addDab(P.last);sparkleAt(el,e)}
function paintMove(el,e){if(!P.cv)return;var p=canvasPt(P.cv,e),l=P.last,dx=p.x-l.x,dy=p.y-l.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<9)return;
  var n=Math.floor(dist/9);for(var i=1;i<=n;i++)addDab({x:l.x+dx*i*9/dist,y:l.y+dy*i*9/dist});P.last={x:l.x+dx*n*9/dist,y:l.y+dy*n*9/dist};
  if(Math.random()<0.15)sparkleAt(el,e)}
function addDab(p){P.dabs.push({x:p.x,y:p.y,k:REDUCED?5:0,c:paintHex(),cv:P.cv});if(!P.raf)P.raf=requestAnimationFrame(paintTick)}
function paintTick(){P.raf=0;var next=[];
  P.dabs.forEach(function(d){var g=d.cv.getContext('2d');d.k++;g.globalAlpha=REDUCED?0.6:0.16;g.fillStyle=d.c;g.beginPath();g.arc(d.x,d.y,6+d.k*4.2,0,Math.PI*2);g.fill();if(d.k<6)next.push(d)});
  P.dabs=next;if(next.length)P.raf=requestAnimationFrame(paintTick)}
function sparkleAt(el,e){if(REDUCED)return;var r=el.getBoundingClientRect(),s=document.createElement('i');s.className='psp';s.innerHTML=SPARK;
  s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';s.style.color=paintHex();el.appendChild(s);setTimeout(function(){s.remove()},750)}
/* ---------- shell ---------- */
function render(){
  var a=me(),v=S.view,nav=[['home','Home'],['shop','Build a keychain']];if(kits().length)nav.push(['kits','DIY kits']);if(S.canEdit)nav.push(['admin','Back office']);

  var h='<div class="wrap"><header class="top"><button type="button" class="brand" data-go="home" aria-label="'+esc(catalog.shop.name)+' home"><img class="logo" src="'+LOGO+'" alt="" width="48" height="48"><span class="brandtx"><b>'+esc(catalog.shop.name)+'</b><small>by My Curious Hands</small></span></button>';
  h+='<nav class="nav" aria-label="Main">'+nav.map(function(n){return '<button type="button" class="navlink" data-go="'+n[0]+'"'+(v===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join('');
  if(/^https:\/\//.test(ig))h+='<a class="iglink" href="'+esc(ig)+'" target="_blank" rel="noopener" aria-label="Instagram @'+esc(igName)+'"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.4" cy="6.6" r="1.3" fill="currentColor"/></svg><span>@'+esc(igName)+'</span></a>';
  h+=a?'<button type="button" class="acct" data-go="account" aria-label="Your account"><span class="avatar" aria-hidden="true">'+esc(a.name[0]||'?')+'</span>'+esc(a.name.split(' ')[0])+'</button>':'<button type="button" class="btn small" data-go="signin">Sign in</button>';
  h+='</nav></header>';
  h+=(v==='admin'?renderAdmin():v==='shop'?renderShop():v==='auth'?renderAuth():renderHome())+'</div>';
  $('#root').innerHTML=h;
  if(v==='admin')bindAdmin();else if(v==='shop')bindShop();else if(v==='auth')bindAuth();else bindHome();
}
S.keys=keysFromText('HELLO').filter(function(k){return k.id}).map(function(k,i){return {id:k.id,cap:nextCap(i)}});
accLoad();

  if(!window.claude||!window.claude.use)return;
