# Web server for a static site on the AVK platform. Runs as an unprivileged user on port 8080 with a read-only filesystem
# (only /tmp is writable). TLS is Cloudflare's job; this server never sees a certificate.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # A request id for every response: the caller's X-Request-Id if it is safe, else Cloudflare's Cf-Ray, else a new one.
  map $http_x_request_id $safe_incoming_id { default ""; "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id; }
  map $http_cf_ray $safe_ray_id { default ""; "~^[A-Za-z0-9._-]{8,64}$" $http_cf_ray; }
  map "$safe_incoming_id|$safe_ray_id" $req_id {
    default $request_id;
    "~^(?<mine>[^|]+)\|" $mine;
    "~^\|(?<ray>.+)$" $ray;
  }

  # One JSON line per request on stdout, like the Java apps: no query string, no cookies, no client address.
  log_format json escape=json '{"@timestamp":"$time_iso8601","log":{"level":"INFO","logger":"access"},"service":{"name":"clickers"},'
                              '"message":"$request_method $uri $status ${request_time}s","request_id":"$req_id"}';
  access_log /dev/stdout json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Request-Id $req_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Everything comes from this site itself. Inline scripts and styles are allowed because single-file pages need them; tighten
    # `script-src` (use hashes) when the site stops using inline code. Forms may only mailto:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;

    location = /healthz { default_type application/json; return 200 '{"status":"up"}'; }
    location = /readyz  { default_type application/json; return 200 '{"status":"ready"}'; }

    location / {
      try_files $uri $uri/ =404;
      # Pages change with a release: browsers must re-check them. Files with a version in the name could be cached for a year.
      add_header Cache-Control "no-cache" always;
      add_header X-Request-Id $req_id always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
  }
}
